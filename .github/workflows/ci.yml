# Lints, tests and builds Everwall on every push to main and every pull
# request: clippy with warnings as errors, the unit tests and a release
# build, on Ubuntu (the
# libraries Tauri builds against come from apt) and on Windows (the runner's
# default MSVC toolchain; the published zip is built with the GNU one, as the
# README describes).
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            os: ubuntu-24.04
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7

      - name: Install the libraries Tauri builds against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      # The toolchain Everwall 1.0 was linted with: newer clippy releases add
      # lints, so it is raised on purpose, not by surprise.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99'
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Clippy
        run: cargo clippy --release --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked
